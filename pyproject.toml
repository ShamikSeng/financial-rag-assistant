[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-rag-assistant"
version = "0.1.0"
description = "Production-grade RAG system for financial document intelligence"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "langchain-core",
    "langchain-classic",
    "langchain-text-splitters",
    "langchain-community",
    "langchain-groq",
    "langchain-google-genai",
    "chromadb",
    "sentence-transformers",
    "pypdf",
    "python-dotenv",
    "python-multipart",
    "aiofiles",
    "tiktoken",
    "streamlit",
    "requests",
    "pandas",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["eval/tests"]
pythonpath = ["."]
